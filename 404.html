<script>
/* SPA fallback for GitHub Pages: unmatched paths under the site (e.g. a page
   reloaded at /lapuschkin.eats/about, or a typo) boot the app at the root with
   the path carried as a #fragment, which the app then routes and rewrites back
   to a clean path. Recipe paths have real stub pages, so they never land here. */
(function () {
  var base = "/lapuschkin.eats/";
  var p = location.pathname;
  var seg = p.indexOf(base) === 0 ? p.slice(base.length) : "";
  seg = seg.replace(/\/$/, "").replace(/^\//, "");
  location.replace(base + location.search + (seg ? "#" + seg : ""));
})();
</script>
